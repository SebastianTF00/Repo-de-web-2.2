# Cambia el puerto para no chocar con otros servicios
server.port=8081

# Configuración de Eureka
spring.application.name=service-productos
eureka.client.service-url.default-zone=http://localhost:8761/eureka/

# Configuración de Base de Datos (AJUSTA ESTO)
spring.datasource.url=jdbc:mysql://localhost:3306/techstore_db
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Opcional: para que se cree la estructura sola
spring.jpa.hibernate.ddl-auto=update
spring.main.allow-bean-definition-overriding=true