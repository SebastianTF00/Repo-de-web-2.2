# ==========================================
# CONFIGURACIÓN DEL SERVIDOR
# ==========================================
spring.application.name=service-gateway
server.port=8080

# ==========================================
# CONEXIÓN A EUREKA (El Directorio)
# ==========================================
eureka.client.service-url.default-zone=http://localhost:8761/eureka/

# ==========================================
# RUTAS DEL API GATEWAY
# ==========================================

# Ruta hacia Productos (/api/productos y /api/categorias)
spring.cloud.gateway.routes[0].id=route-productos
spring.cloud.gateway.routes[0].uri=lb://service-productos
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/productos/**, /api/categorias/**

# Ruta hacia Usuarios (/api/usuarios)
spring.cloud.gateway.routes[1].id=route-usuarios
spring.cloud.gateway.routes[1].uri=lb://service-usuarios
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/usuarios/**

# Ruta hacia Pedidos (Maneja /api/pedidos)
spring.cloud.gateway.routes[2].id=route-pedidos
spring.cloud.gateway.routes[2].uri=lb://service-pedidos
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/pedidos/**