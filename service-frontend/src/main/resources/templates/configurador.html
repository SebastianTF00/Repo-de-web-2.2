<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Configurador de PC</title>
    <link rel="stylesheet" href="/css/estilos.css?v=builder2">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body style="background-color: #0b0f17; color: white;">

<header style="padding: 1.5rem 4%; background: #131a26; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center;">
    <h1 style="font-size: 1.5rem; font-weight: 800; color: #fff;">TechStore</h1>
    <nav style="display: flex; gap: 2rem; align-items: center;">
        <a href="/" style="color: #64748b; text-decoration: none;">Inicio</a>
        <a href="/tienda/categorias" style="color: #64748b; text-decoration: none;">Tienda</a>
    </nav>
</header>

<div class="builder-layout">

    <div class="builder-steps">
        <h2 style="margin-bottom: 2rem;">Arma tu PC Ideal</h2>

        <div class="step-container">
            <div class="step-header">
                <h3 style="margin: 0;"><span class="step-number">1</span> Procesador</h3>
            </div>
            <div class="component-list" id="list-procesadores">
                <div th:each="prod : ${procesadores}"
                     class="component-item"
                     data-tipo="cpu"
                     th:data-precio="${prod.precio}"
                     th:data-nombre="${prod.nombre}"
                     th:data-imagen="${prod.imagenUrl}"
                     th:data-id="${prod.idProducto}"
                     onclick="seleccionarComponente(this)">

                    <img th:src="${prod.imagenUrl != null ? prod.imagenUrl : '/images/default-hardware.png'}" alt="CPU">
                    <h4 style="font-size: 1rem; margin: 0 0 0.5rem 0;" th:text="${prod.nombre}">Ryzen 5</h4>
                    <p style="color: #10b981; font-weight: bold; margin: 0;" th:text="'S/ ' + ${#numbers.formatDecimal(prod.precio, 1, 2)}">S/ 0.00</p>
                </div>
            </div>
        </div>

        <div class="step-container">
            <div class="step-header">
                <h3 style="margin: 0;"><span class="step-number">2</span> Placa Madre</h3>
            </div>
            <div class="component-list" id="list-placas">
                <div th:each="prod : ${placas}"
                     class="component-item"
                     data-tipo="mb"
                     th:data-precio="${prod.precio}"
                     th:data-nombre="${prod.nombre}"
                     th:data-imagen="${prod.imagenUrl}"
                     th:data-id="${prod.idProducto}"
                     onclick="seleccionarComponente(this)">

                    <img th:src="${prod.imagenUrl != null ? prod.imagenUrl : '/images/default-hardware.png'}" alt="Placa">
                    <h4 style="font-size: 1rem; margin: 0 0 0.5rem 0;" th:text="${prod.nombre}">Placa Base</h4>
                    <p style="color: #10b981; font-weight: bold; margin: 0;" th:text="'S/ ' + ${#numbers.formatDecimal(prod.precio, 1, 2)}">S/ 0.00</p>
                </div>
            </div>
        </div>

        <div class="step-container">
            <div class="step-header">
                <h3 style="margin: 0;"><span class="step-number">3</span> Tarjeta de Video</h3>
            </div>
            <div class="component-list" id="list-gpu">
                <div th:each="prod : ${gpus}"
                     class="component-item"
                     data-tipo="gpu"
                     th:data-precio="${prod.precio}"
                     th:data-nombre="${prod.nombre}"
                     th:data-imagen="${prod.imagenUrl}"
                     th:data-id="${prod.idProducto}"
                     onclick="seleccionarComponente(this)">

                    <img th:src="${prod.imagenUrl != null ? prod.imagenUrl : '/images/default-hardware.png'}" alt="GPU">
                    <h4 style="font-size: 1rem; margin: 0 0 0.5rem 0;" th:text="${prod.nombre}">GPU</h4>
                    <p style="color: #10b981; font-weight: bold; margin: 0;" th:text="'S/ ' + ${#numbers.formatDecimal(prod.precio, 1, 2)}">S/ 0.00</p>
                </div>
            </div>
        </div>

    </div>

    <div class="builder-summary">
        <h3 style="border-bottom: 1px solid #1e293b; padding-bottom: 1rem; margin-top: 0;">Tu Configuración</h3>

        <div style="margin-top: 1.5rem;">
            <div class="summary-item">
                <span>CPU:</span>
                <span id="sum-cpu" style="text-align: right; font-weight: bold; width: 65%;">--</span>
            </div>
            <div class="summary-item">
                <span>Placa Madre:</span>
                <span id="sum-mb" style="text-align: right; font-weight: bold; width: 65%;">--</span>
            </div>
            <div class="summary-item">
                <span>GPU:</span>
                <span id="sum-gpu" style="text-align: right; font-weight: bold; width: 65%;">--</span>
            </div>
        </div>

        <div style="border-top: 2px solid #1e293b; margin-top: 1.5rem; padding-top: 1rem; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 1.1rem; font-weight: bold;">Total Estimado:</span>
            <span id="sum-total" style="color: #10b981; font-size: 1.5rem; font-weight: 900;">S/ 0.00</span>
        </div>

        <button style="width: 100%; background: #3a86ff; color: white; border: none; padding: 1rem; border-radius: 8px; font-weight: bold; margin-top: 1.5rem; cursor: pointer; transition: 0.2s;"
                onmouseover="this.style.background='#2563eb'"
                onmouseout="this.style.background='#3a86ff'"
                onclick="agregarConfiguracionAlCarrito()">
            Agregar PC al Carrito
        </button>
    </div>

</div>

<script>
    // Ahora guardamos el objeto completo para poder mandarlo al carrito real luego
    let configuracionActual = {
        cpu: null,
        mb: null,
        gpu: null
    };

    function seleccionarComponente(elemento) {
        // Leemos los datos de forma segura desde los atributos data-*
        const tipo = elemento.getAttribute('data-tipo');
        const precio = parseFloat(elemento.getAttribute('data-precio'));
        const nombre = elemento.getAttribute('data-nombre');
        const idProducto = elemento.getAttribute('data-id');
        const imagenUrl = elemento.getAttribute('data-imagen');

        // Quitar la clase 'selected' de los hermanos
        const hermanos = elemento.parentElement.children;
        for (let i = 0; i < hermanos.length; i++) {
            hermanos[i].classList.remove('selected');
        }

        // Agregar 'selected' al clickeado
        elemento.classList.add('selected');

        // Guardamos todo el objeto
        configuracionActual[tipo] = {
            id: idProducto,
            nombre: nombre,
            precio: precio,
            imagen: imagenUrl,
            descripcion: 'Componente de ensamble PC',
            cantidad: 1
        };

        // Actualizar UI del resumen
        document.getElementById(`sum-${tipo}`).innerText = nombre;
        calcularTotalConfiguracion();
    }

    function calcularTotalConfiguracion() {
        let total = 0;
        if(configuracionActual.cpu) total += configuracionActual.cpu.precio;
        if(configuracionActual.mb) total += configuracionActual.mb.precio;
        if(configuracionActual.gpu) total += configuracionActual.gpu.precio;

        document.getElementById('sum-total').innerText = 'S/ ' + total.toFixed(2);
    }

    function agregarConfiguracionAlCarrito() {
        if(!configuracionActual.cpu || !configuracionActual.mb || !configuracionActual.gpu) {
             if (typeof mostrarNotificacionPremium === "function") {
                mostrarNotificacionPremium("Debes seleccionar Procesador, Placa y Tarjeta de Video.");
            } else {
                alert("Debes seleccionar Procesador, Placa y Tarjeta de Video.");
            }
            return;
        }

        // Obtenemos el carrito actual de la memoria
        let carrito = JSON.parse(localStorage.getItem('techstore_carrito')) || [];

        // Agregamos los 3 componentes
        carrito.push(configuracionActual.cpu);
        carrito.push(configuracionActual.mb);
        carrito.push(configuracionActual.gpu);

        // Guardamos y actualizamos el contador global
        localStorage.setItem('techstore_carrito', JSON.stringify(carrito));
        if(typeof actualizarContadorCarrito === 'function') actualizarContadorCarrito();

        if (typeof mostrarNotificacionPremium === "function") {
            mostrarNotificacionPremium("¡Ensamble PC agregado con éxito!");
        } else {
            alert("¡Ensamble PC agregado con éxito!");
        }

        // Redirigir al carrito después de 1 segundo para que el usuario pague
        setTimeout(() => {
            window.location.href = "/carrito";
        }, 1200);
    }
</script>

<script src="/js/carrito.js?v=5"></script>
</body>
</html>
