<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Categorías</title>
    <link rel="stylesheet" href="/css/estilos.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

<div class="store-layout-container">

    <aside class="sidebar-filters">
        <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5rem;">Filtros</h3>

        <p style="color: #64748b; font-size: 0.85rem; font-weight: bold; margin-bottom: 0.5rem;">Categorías</p>
        <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; font-size: 0.9rem;">
            <label><input type="checkbox"> Procesadores</label>
            <label><input type="checkbox"> Tarjetas de Video</label>
            <label><input type="checkbox"> Periféricos</label>
            <label><input type="checkbox"> Placa Madre</label>
        </div>

        <p style="color: #64748b; font-size: 0.85rem; font-weight: bold; margin-bottom: 0.5rem;">Rango de Precio</p>
        <input type="range" style="width: 100%; margin-bottom: 0.5rem;">
        <span style="font-size: 0.85rem; color: #3a86ff;">Hasta S/. 5000</span>
    </aside>

    <main class="products-display-area">

        <div class="results-counter-bar">
            <span th:text="'Mostrando ' + ${productos.size()} + ' productos'">Mostrando 0 productos</span>
        </div>

        <div class="products-grid-catalog">
            <div class="product-card-item" th:each="prod : ${productos}">

                <div class="product-img-wrapper">
                    <img th:src="${prod.imagenUrl != null ? prod.imagenUrl : '/images/default-hardware.png'}" alt="Componente">
                </div>

                <h4 class="product-card-title" th:text="${prod.nombre}">Nombre del Producto</h4>
                <p class="product-card-price" th:text="'S/. ' + ${prod.precio}">S/. 0.00</p>
                <p class="product-card-stock" th:text="'Stock: ' + ${prod.stock}">Stock: 0</p>

                <div class="product-card-actions">
                    <a href="#" class="btn-card-secondary">Ver Detalle</a>
                    <button class="btn-card-primary">Agregar</button>
                </div>

            </div>
        </div>

    </main>
</div>
